[project]
name = "comfyui-timeline"
version = "1.0.0"
description = "Multi-track video timeline editor embedded directly inside ComfyUI with FFmpeg rendering and workflow queue integration."
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"

[project.urls]
Repository = "https://github.com/nucciocanino/-ComfyUI-Timeline"

[tool.comfy]
PublisherId = "comfyui-timeline"
DisplayName = "ComfyUI Timeline Editor"
Icon = "🎬"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
